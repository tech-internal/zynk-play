# Standalone Postgres only — separate from repo root docker-compose.yml.
# Run from this directory:
#   cp env.example .env   # then edit .env
#   docker compose up -d
#
# Django .env (project root) when pointing at this DB:
#   DB_ENGINE=django.db.backends.postgresql
#   DB_NAME=zynk_play
#   DB_USER=zynk_app
#   DB_PASSWORD=<same as POSTGRES_PASSWORD>
#   DB_HOST=127.0.0.1
#   DB_PORT=5433

name: zynk-play-db-standalone

services:
  postgres:
    image: postgres:16-alpine
    container_name: zynk-play-postgres-standalone
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - zynk_play_pgdata_standalone:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zynk_play_pgdata_standalone:
